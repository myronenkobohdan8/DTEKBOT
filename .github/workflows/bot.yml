name: DTEK schedule bot

on:
  schedule:
    - cron: "*/10 * * * *"     # кожні 10 хвилин (GitHub може запускати з невеликою затримкою)
  workflow_dispatch:           # ручний запуск кнопкою
    inputs:
      force:
        description: "Опублікувати поточний графік примусово (навіть без змін)"
        type: boolean
        default: false
      check:
        description: "Лише перевірити доступ бота до каналу (нічого не публікує)"
        type: boolean
        default: false

permissions:
  contents: write              # щоб зберігати state.json

concurrency:
  group: dtek-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        if: ${{ !inputs.check }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run bot
        run: python -m bot.main ${{ inputs.check && '--check' || '' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          FORCE: ${{ inputs.force }}

      - name: Save state
        if: always()
        run: |
          git config user.name "dtek-bot"
          git config user.email "dtek-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update state"
            git pull --rebase -q origin main || true
            git push
          fi
